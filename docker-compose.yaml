services:
  db:
    image: postgres
    environment:
      POSTGRES_DB: "studs"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studs"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
