services:
  db:
    image: postgres
    env_file: "env/db.env"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studs"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  tomcat:
    cpus: 4
    mem_limit: 8g
    build:
      context: ./backend
      dockerfile: tomcat/Dockerfile
    env_file: "env/backend.env"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy