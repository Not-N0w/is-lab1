<div class="body">
  <p>Delete discipline "{{ target().name }}"?</p>

  @if (related().length) {
    <p class="hint">Choose a replacement for the related lab works:</p>
    @if (!options().length) {
      <p class="error">No other disciplines available for replacement. Create a new one first.</p>
    }
    @for (lab of related(); track lab.id) {
      <div class="replace-row">
        <span>#{{ lab.id }} {{ lab.name }}</span>
        <p-select [options]="options()" [(ngModel)]="replacements[lab.id!]"
                  optionLabel="label" optionValue="id" placeholder="Replacement" appendTo="body" [filter]="true" />
      </div>
    }
  }

  <div class="actions">
    <p-button label="Cancel" severity="secondary" (onClick)="cancel.emit()" />
    <p-button label="Delete" severity="danger" [disabled]="!canDelete()" (onClick)="confirm()" />
  </div>
</div>
