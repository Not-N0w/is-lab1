<div class="body">
  <p>Delete lab work "{{ target().name }}"?</p>

  <p class="hint">What to do with the related coordinates, discipline and author if they are no longer referenced:</p>
  <p-selectbutton [options]="strategies" [(ngModel)]="strategy"
                  optionLabel="label" optionValue="value" [allowEmpty]="false" />

  <div class="actions">
    <p-button label="Cancel" severity="secondary" (onClick)="cancel.emit()" />
    <p-button label="Delete" severity="danger" (onClick)="confirm()" />
  </div>
</div>
