<p-table [value]="locations()" dataKey="id" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">
        <div class="th">ID <p-sortIcon field="id" />
          <p-columnFilter type="text" field="id" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="name">
        <div class="th">Name <p-sortIcon field="name" />
          <p-columnFilter type="text" field="name" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="x">
        <div class="th">X <p-sortIcon field="x" />
          <p-columnFilter type="text" field="x" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="y">
        <div class="th">Y <p-sortIcon field="y" />
          <p-columnFilter type="text" field="y" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="z">
        <div class="th">Z <p-sortIcon field="z" />
          <p-columnFilter type="text" field="z" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th style="width: 4rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-l>
    <tr>
      <td>{{ l.id }}</td>
      <td>{{ l.name ?? '—' }}</td>
      <td>{{ l.x }}</td>
      <td>{{ l.y }}</td>
      <td>{{ l.z }}</td>
      <td>
        <p-button icon="pi pi-bars" [rounded]="true" [text]="true" (onClick)="menu.toggle($event)" />
        <p-menu #menu [model]="l.actions" [popup]="true" appendTo="body" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="6">Ничего не найдено</td></tr>
  </ng-template>
</p-table>

<app-delete-window entity="location" [target]="deleteTarget()" [(visible)]="deleteVisible" (deleted)="reload()" />
