<p-table [value]="persons()" dataKey="id" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">
        <div class="th">ID <p-sortIcon field="id" />
          <p-columnFilter type="text" field="id" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="name">
        <div class="th">Name <p-sortIcon field="name" />
          <p-columnFilter type="text" field="name" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="eyeColor">
        <div class="th">Eye color <p-sortIcon field="eyeColor" />
          <p-columnFilter type="text" field="eyeColor" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="hairColor">
        <div class="th">Hair color <p-sortIcon field="hairColor" />
          <p-columnFilter type="text" field="hairColor" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="height">
        <div class="th">Height <p-sortIcon field="height" />
          <p-columnFilter type="text" field="height" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="nationality">
        <div class="th">Nationality <p-sortIcon field="nationality" />
          <p-columnFilter type="text" field="nationality" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="location.name">
        <div class="th">Location <p-sortIcon field="location.name" />
          <p-columnFilter type="text" field="location.name" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th style="width: 4rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-p>
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.eyeColor }}</td>
      <td>{{ p.hairColor ?? '—' }}</td>
      <td>{{ p.height }}</td>
      <td>{{ p.nationality ?? '—' }}</td>
      <td>{{ p.location.name ?? '#' + p.location.id }}</td>
      <td>
        <p-button icon="pi pi-bars" [rounded]="true" [text]="true" (onClick)="menu.toggle($event)" />
        <p-menu #menu [model]="p.actions" [popup]="true" appendTo="body" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="8">Ничего не найдено</td></tr>
  </ng-template>
</p-table>

<app-delete-window entity="person" [target]="deleteTarget()" [(visible)]="deleteVisible" (deleted)="reload()" />
