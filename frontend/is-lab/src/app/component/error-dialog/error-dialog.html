<p-dialog header="Ошибка" [modal]="true" appendTo="body" [draggable]="false" [resizable]="false"
          [visible]="visible()" (visibleChange)="onVisibleChange($event)"
          [style]="{ width: '420px' }" [breakpoints]="{ '575px': '90vw' }">
  <div class="error-body">
    <i class="pi pi-exclamation-circle"></i>
    <p>{{ errorService.message() }}</p>
  </div>
  <div class="error-actions">
    <p-button label="OK" (onClick)="errorService.close()" />
  </div>
</p-dialog>
