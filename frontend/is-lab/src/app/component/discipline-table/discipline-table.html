<p-table [value]="disciplines()" dataKey="id" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">
        <div class="th">ID <p-sortIcon field="id" />
          <p-columnFilter type="text" field="id" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="name">
        <div class="th">Name <p-sortIcon field="name" />
          <p-columnFilter type="text" field="name" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th pSortableColumn="practiceHours">
        <div class="th">Practice hours <p-sortIcon field="practiceHours" />
          <p-columnFilter type="text" field="practiceHours" display="menu" matchMode="exact"
                          [showMatchModes]="false" [showOperator]="false" [showAddButton]="false" />
        </div>
      </th>
      <th style="width: 4rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-d>
    <tr>
      <td>{{ d.id }}</td>
      <td>{{ d.name }}</td>
      <td>{{ d.practiceHours ?? '—' }}</td>
      <td>
        <p-button icon="pi pi-bars" [rounded]="true" [text]="true" (onClick)="menu.toggle($event)" />
        <p-menu #menu [model]="d.actions" [popup]="true" appendTo="body" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="4">Ничего не найдено</td></tr>
  </ng-template>
</p-table>

<app-delete-window entity="discipline" [target]="deleteTarget()" [(visible)]="deleteVisible" (deleted)="reload()" />
