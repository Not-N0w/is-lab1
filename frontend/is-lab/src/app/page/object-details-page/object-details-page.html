<div class="outer">
  <div class="content">
    <div class="header">
      <h2>{{ title() }} #{{ id() }}</h2>
      <div class="buttons">
        <p-button label="Назад" icon="pi pi-arrow-left" severity="secondary" [text]="true" (onClick)="back()" />
        <p-button label="Edit" icon="pi pi-pencil" [routerLink]="['/' + entity(), id(), 'edit']" />
        <p-button label="Delete" icon="pi pi-trash" severity="danger" [disabled]="!object()"
                  (onClick)="deleteVisible.set(true)" />
      </div>
    </div>

    @if (object(); as o) {
      @switch (entity()) {
        @case ('lab-work') { <app-lab-work-details [value]="o" /> }
        @case ('coordinates') { <app-coordinates-details [value]="o" /> }
        @case ('discipline') { <app-discipline-details [value]="o" /> }
        @case ('person') { <app-person-details [value]="o" /> }
        @case ('location') { <app-location-details [value]="o" /> }
      }
    } @else {
      <p>Loading...</p>
    }
  </div>
</div>

<app-delete-window [entity]="entity()" [target]="object()" [(visible)]="deleteVisible" (deleted)="afterDelete()" />
